name: Build 360T6GS WRT

on:
  workflow_dispatch:
    inputs:
      build-openwrt-main:
        description: 'Build openwrt-main (OpenWrt main)'
        type: boolean
        default: true
      build-immortalwrt-main:
        description: 'Build immortalwrt-main (ImmortalWrt master)'
        type: boolean
        default: true
      build-lede-main:
        description: 'Build lede-main (coolsnowwolf/lede)'
        type: boolean
        default: false
      build-x-wrt-main:
        description: 'Build x-wrt-main (x-wrt/x-wrt)'
        type: boolean
        default: false
      build-lienol-main:
        description: 'Build lienol-main (Lienol/openwrt 25.12)'
        type: boolean
        default: false
      ft-fix:
        description: 'Apply FT fix patches (mac80211 + hostapd). NOTE: only for 6.18 kernel sources (openwrt-main / immortalwrt-main)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix from inputs
        id: set-matrix
        run: |
          MATRIX='[]'
          FT_FIX="${{ inputs.ft-fix }}"
          add() {
            MATRIX=$(echo "$MATRIX" | jq -c --arg name "$1" --arg repo "$2" --arg ref "$3" --arg ftfix "$4" \
              '. + [{"name": $name, "repo": $repo, "ref": $ref, "ft-fix": $ftfix}]')
          }
          if [ "${{ inputs.build-openwrt-main }}" == "true" ]; then add openwrt-main "https://github.com/openwrt/openwrt.git" main "$FT_FIX"; fi
          if [ "${{ inputs.build-immortalwrt-main }}" == "true" ]; then add immortalwrt-main "https://github.com/immortalwrt/immortalwrt.git" master "$FT_FIX"; fi
          if [ "${{ inputs.build-lede-main }}" == "true" ]; then add lede-main "https://github.com/coolsnowwolf/lede.git" master false; fi
          if [ "${{ inputs.build-x-wrt-main }}" == "true" ]; then add x-wrt-main "https://github.com/x-wrt/x-wrt.git" master false; fi
          if [ "${{ inputs.build-lienol-main }}" == "true" ]; then add lienol-main "https://github.com/Lienol/openwrt.git" 25.12 false; fi
          if [ "$MATRIX" == "[]" ]; then
            echo "::error::No source selected. Tick at least one build option."
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    name: ${{ matrix.name }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libncurses5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip wget xxd zlib1g-dev

      - name: Clone source
        id: clone
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" "${{ matrix.repo }}" source
          echo "srcsha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: source/dl
          key: dl-${{ matrix.name }}-${{ github.sha }}-${{ steps.clone.outputs.srcsha }}
          restore-keys: |
            dl-${{ matrix.name }}-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: source/.ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}-${{ steps.clone.outputs.srcsha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Add luci-app-easymesh source
        run: |
          git clone --depth 1 https://github.com/torguardvpn/luci-app-easymesh.git source/package/luci-app-easymesh

      - name: Add luci-app-client-manager source
        run: |
          git clone --depth 1 https://github.com/nightcodex7/luci-app-client-manager.git source/package/luci-app-client-manager

      - name: Apply profile patch
        run: |
          bash scripts/apply-t6gs.sh "$(pwd)/source"

      - name: Apply FT fix patches
        if: matrix.ft-fix == 'true'
        run: |
          bash scripts/apply-ft-fix.sh "$(pwd)/source"

      - name: Configure target profile
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Download package sources
        working-directory: source
        run: make download -j8

      - name: Build firmware
        working-directory: source
        run: make -j"$(nproc)" V=s

      - name: Collect artifacts
        run: |
          mkdir -p "artifacts/${{ matrix.name }}"
          cp -a source/bin/targets/ramips/mt7621/* "artifacts/${{ matrix.name }}/"
          ls -lah "artifacts/${{ matrix.name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
