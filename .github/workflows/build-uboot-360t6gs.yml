name: Build 360T6GS U-Boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout uboot-mt7621
        uses: actions/checkout@v4
        with:
          repository: DragonBluep/uboot-mt7621
          ref: main
          path: uboot-mt7621

      - name: Install essential packages
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          echo 'switch to python2 as default'
          sudo rm /usr/bin/python
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz
          tar -xJf Python-2.7.18.tar.xz
          cd Python-2.7.18
          ./configure && sudo make && sudo make install
          sudo ln -s /usr/bin/python2 /usr/bin/python

      - name: Download OpenWrt toolchain
        run: |
          wget -O - https://github.com/DragonBluep/uboot-mt7621/releases/download/20230517/openwrt-toolchain-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz \
            | tar --xz -xf -

      - name: Build U-Boot for 360T6GS
        working-directory: uboot-mt7621
        run: |
          ./customize.sh \
            NAND \
            "512k(u-boot),256k(u-boot-env),256k(factory),-(firmware)" \
            0x0 \
            7 \
            13 \
            880 \
            1200 \
            DDR3-256MiB \
            115200

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-T6GS
          path: uboot-mt7621/archive/
          if-no-files-found: error
