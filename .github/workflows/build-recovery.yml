name: Build 360T6GS Recovery Initramfs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: "2G"
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libncurses5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip wget xxd zlib1g-dev

      - name: Clone source
        id: clone
        run: |
          git clone --depth 1 --branch master https://github.com/immortalwrt/immortalwrt.git source
          echo "srcsha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: source/dl
          key: dl-recovery-${{ github.sha }}-${{ steps.clone.outputs.srcsha }}
          restore-keys: |
            dl-recovery-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: source/.ccache
          key: ccache-recovery-${{ github.sha }}-${{ steps.clone.outputs.srcsha }}
          restore-keys: |
            ccache-recovery-

      - name: Apply recovery DTS patch
        run: |
          bash scripts/apply-t6gs-recovery.sh "$(pwd)/source"

      - name: Apply FT fix patches
        run: |
          bash scripts/apply-ft-fix.sh "$(pwd)/source"

      - name: Configure target profile
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Download package sources
        working-directory: source
        run: make download -j8

      - name: Build firmware
        working-directory: source
        run: make -j"$(nproc)" V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -a source/bin/targets/ramips/mt7621/* artifacts/
          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: recovery
          path: artifacts
          if-no-files-found: error
